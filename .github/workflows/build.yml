name: Build Aegis APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build libbox.aar (sing-box)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264"
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264
          export PATH=$PATH:$(go env GOPATH)/bin
          git clone https://github.com/SagerNet/sing-box /tmp/sing-box
          cd /tmp/sing-box
          git checkout $(git tag | grep '^v1.11' | grep -v -- '-' | sort -V | tail -1)
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          go run ./cmd/internal/build_libbox -target android
          ls -la libbox.aar
          cp libbox.aar $GITHUB_WORKSPACE/libbox.aar

      - name: Create Flutter project and overlay Aegis files
        run: |
          flutter create --org com.example --project-name vless_vpn --platforms android app
          mkdir -p app/android/app/libs
          cp libbox.aar app/android/app/libs/
          cp -r android/app/src app/android/app/
          cp android/app/proguard-rules.pro app/android/app/
          cd app/android/app
          if [ -f build.gradle.kts ]; then
            printf '\ndependencies {\n    implementation(files("libs/libbox.aar"))\n    implementation("androidx.core:core-ktx:1.13.1")\n}\n' >> build.gradle.kts
          else
            printf "\ndependencies {\n    implementation files('libs/libbox.aar')\n    implementation 'androidx.core:core-ktx:1.13.1'\n}\n" >> build.gradle
          fi

      - name: Build APK
        run: |
          cd app
          flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-apk
          path: app/build/app/outputs/flutter-apk/*.apk
